<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Cabeçalho do Boletim -->
    <header class="header">
      <h1>Boletim Digital</h1>
      <p class="subtitle">9º Ano — Turma 9B — N.º 27</p>
    </header>

    <!-- Tela de Acesso / PIN -->
    <section id="area-login" class="card-acesso">
      <h2>Acesso ao Boletim</h2>
      <p class="info-aluno">Estudante: Turma <strong>9B</strong> | Chamada <strong>27</strong></p>
      
      <div class="form-group">
        <label for="campo-pin">Digite seu PIN:</label>
        <input type="password" id="campo-pin" placeholder="Insira o PIN" maxlength="20">
        <button id="btn-entrar" onclick="fazerLogin()">Entrar</button>
      </div>
      
      <p id="mensagem-status-login" class="mensagem-status"></p>
    </section>

    <!-- Conteúdo Principal do Boletim (Escondido antes do Login) -->
    <main id="conteudo-boletim" style="display: none;">
      
      <div class="painel-acoes">
        <button id="btn-editar" onclick="alternarModoEdicao()">Alterar dados</button>
        <button id="btn-salvar" onclick="salvarAlteracoes()" style="display: none;">Salvar alterações</button>
        <button id="btn-cancelar" onclick="cancelarEdicao()" style="display: none;" class="btn-secundario">Cancelar</button>
      </div>

      <p id="mensagem-status-boletim" class="mensagem-status"></p>

      <!-- Cards de Resumo -->
      <section class="cards-grid">
        <div class="card">
          <h3>Média Geral</h3>
          <p id="media-geral" class="card-value">—</p>
        </div>
        <div class="card">
          <h3>Total de Faltas</h3>
          <p id="total-faltas" class="card-value">—</p>
        </div>
        <div class="card">
          <h3>Bom Desempenho</h3>
          <p id="bom-desempenho" class="card-value">—</p>
        </div>
        <div class="card">
          <h3>Atenção Necessária</h3>
          <p id="precisa-atencao" class="card-value">—</p>
        </div>
        <div class="card">
          <h3>Frequência Demonstrativa</h3>
          <p id="frequencia-geral" class="card-value">92%</p>
          <span class="card-subtext">Frequência adequada</span>
        </div>
      </section>

      <!-- Tabela de Notas -->
      <section class="table-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="tabela-boletim">
            <!-- Linhas preenchidas via JavaScript -->
          </tbody>
        </table>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
